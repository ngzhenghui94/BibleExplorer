<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Bible Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">Bible Adventure</div>
      <h1 class="login-title">Read the whole Bible.<br /><span class="accent">Choose your own path.</span></h1>
      <p class="login-sub">Sign in to track your progress and unlock AI-generated chapter summaries and personalized reflection prompts.</p>

      <a class="google-btn" href="/auth/google">
        <svg class="google-g" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Sign in with Google</span>
      </a>

      <p class="login-error" id="login-error" hidden></p>

      <p class="login-foot">
        Your reading progress lives in your browser. AI summaries are generated by
        <code>llama-3.1-8b-instant</code> via Groq.
      </p>
    </div>
  </main>

  <script>
    // Show a friendly message if Google sent us back with an error.
    (() => {
      const params = new URLSearchParams(location.search);
      const err = params.get("error");
      if (!err) return;
      const map = {
        access_denied: "Sign-in was cancelled. Try again whenever you're ready.",
        bad_state: "Sign-in session expired. Please try again.",
        token_exchange: "Couldn't complete sign-in with Google. Please try again.",
        userinfo: "Couldn't load your Google profile. Please try again.",
        no_sub: "Google didn't return a user id. Please try again.",
        server: "Something went wrong on our side. Please try again.",
      };
      const el = document.getElementById("login-error");
      el.textContent = map[err] || `Sign-in error: ${err}`;
      el.hidden = false;
    })();
  </script>
</body>
</html>
